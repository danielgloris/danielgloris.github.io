# Daniel Gloris — Einstellungen der Website.
locale: en-GB
title: Daniel Gloris
name: Daniel Gloris
description: "Research on political attitudes, political behaviour, political tolerance, and polarisation. Research Associate and PhD Candidate at TU Dortmund University."
url: "https://danielgloris.github.io"
baseurl: ""
repository: "danielgloris/danielgloris.github.io"
timezone: Europe/Berlin
encoding: utf-8
markdown: kramdown
highlighter: rouge
permalink: /:title/
plugins: []

include:
  - _pages

# Lokale Werkzeuge, Abhängigkeiten und Dokumentation nicht als Website ausgeben.
exclude:
  - .bundle
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - package-lock.json
  - scripts
  - local
  - node_modules
  - vendor
  - tmp
  - output

# Gemeinsames Seitenlayout aus _layouts/academic.html.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: academic

kramdown:
  input: GFM
  hard_wrap: false
