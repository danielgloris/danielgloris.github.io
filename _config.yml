# Daniel Gloris — academic website. No deployment has been run.
locale: en-GB
title: Daniel Gloris
name: Daniel Gloris
description: "Research on political attitudes, political behaviour, political tolerance, and polarisation. Research Associate and PhD Candidate at TU Dortmund University."
url: "https://danielgloris.github.io"
baseurl: ""
repository: "danielgloris/danielgloris.github.io"
timezone: Europe/Berlin
encoding: utf-8
markdown: kramdown
highlighter: rouge
permalink: /:title/
plugins: []

include:
  - _pages

# Retain the upstream template in the repository, but never build its demonstration content.
exclude:
  - .github
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .devcontainer
  - _drafts
  - _posts
  - _publications
  - _talks
  - _teaching
  - _portfolio
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/terms.md
  - _pages/year-archive.html
  - assets/css/main.scss
  - assets/css/academicons.css
  - assets/css/collapse.css
  - assets/js
  - assets/webfonts
  - images/500x300.png
  - images/bio-photo.jpg
  - images/bio-photo-2.jpg
  - images/editing-talk.png
  - images/profile.png
  - images/themes
  - images/apple-touch-icon-180x180.png
  - images/favicon-32x32.png
  - images/favicon-192x192.png
  - images/favicon-512x512.png
  - images/favicon.ico
  - images/manifest.json
  - files/bibtex1.bib
  - files/paper1.pdf
  - files/paper2.pdf
  - files/paper3.pdf
  - files/slides1.pdf
  - files/slides2.pdf
  - files/slides3.pdf
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - scripts
  - node_modules
  - vendor
  - local
  - tmp
  - output
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - README.md
  - CONTRIBUTING.md
  - LICENSE

# This layout is independent of the original Academic Pages theme.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: academic

kramdown:
  input: GFM
  hard_wrap: false
