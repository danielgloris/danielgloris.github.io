themes:
  - id: tolerance-and-polarisation
    title: Political tolerance and polarisation
    summary: "My BA and MA teaching covers political and social tolerance, prejudice, and polarisation. Courses include Political Intolerance in Democracies, Current Debates on Social and Political Intolerance, and Polarisation in Democracies."
  - id: green-democracy
    title: Climate change and green democracy
    summary: "My MA seminars examine what climate change means for democratic politics. Courses include “Green Democracy?” and “Climate Change and the Challenges of a ‘Green Democracy’”."
  - id: disinformation
    title: Disinformation and conspiracy myths
    summary: "In a co-taught MA project seminar, students explored fake news, disinformation, and conspiracy myths."
  - id: political-theory
    title: Political theory and applied political science
    summary: "Courses and project seminars cover just war theory, justice in urban spaces, and how political science and economics approach the study of change."
  - id: foundations-and-methods
    title: Foundations and research methods
    summary: "I teach introductory political science at TU Dortmund University. At Philipps University Marburg, I taught undergraduate tutorials in philosophy and political science methods, including exercises in SPSS."
